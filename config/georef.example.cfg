[db]
# Configuración de la base de datos a utilizar.

host = db
port = 5432
database = georef_ar_etl
user = georef
password = changeme

[etl]
# Parámetros propios del ETL.

environment = prod

# La variable 'files_dir' especifica qué ruta debería utilizar el ETL
# para almacenar archivos temporales y finales. Relativa a la raíz del
# proyecto.
files_dir = files
reports_dir = reports
bulk_size = 8192
chunk_size = 8192

# URLs de fuentes de datos:
# IGN:
provinces_url = https://dnsg.ign.gob.ar/apps/api/v1/capas-sig/Geodesia+y+demarcación/Límites/provincia/shp
departments_url = https://dnsg.ign.gob.ar/apps/api/v1/capas-sig/Geodesia+y+demarcación/Límites/departamento/shp
settlements_antarctic_bases_url=https://wms.ign.gob.ar/geoserver/ows?service=wfs&version=1.1.0&request=GetFeature&typeName=ign:bahra_base_antartica&outputFormat=SHAPE-ZIP
settlements_hamlets_url=https://wms.ign.gob.ar/geoserver/ows?service=wfs&version=1.1.0&request=GetFeature&typeName=ign:bahra_paraje&outputFormat=SHAPE-ZIP
settlements_localities_url=https://wms.ign.gob.ar/geoserver/ows?service=wfs&version=1.1.0&request=GetFeature&typeName=ign:localidad_bahra&outputFormat=SHAPE-ZIP

# BAHRA:
settlements_entities_url = https://wms.ign.gob.ar/geoserver/bahra/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=bahra:entidad_bahra&outputFormat=SHAPE-ZIP

# SAMPLE
localities_url = https://infra.datos.gob.ar/georef/src/indec/entidades_RMBA.zip

# INDEC:
local_governments_indec_url = https://geonode.indec.gob.ar/geoserver/geonode/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=gobiernos_locales&outputFormat=shape-zip
census_localities_url = https://geonode.indec.gob.ar/geoserver/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=localidades_censales&outputFormat=shape-zip
streets_url_template = https://infra.datos.gob.ar/georef_backup/backup/indec/calles_{}.geojson
street_blocks_url_template = https://infra.datos.gob.ar/georef_backup/backup/indec/cuadras_{}.geojson

agglomerations_url=https://geonode.indec.gob.ar/geoserver/geonode/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:aglomerados&outputFormat=shape-zip
census_tracts_url=https://geonode.indec.gob.ar/geoserver/geonode/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:fracciones_censales&outputFormat=shape-zip
census_blocks_url=https://geonode.indec.gob.ar/geoserver/geonode/wfs?service=WFS&version=2.0.0&request=GetFeature&typeName=geonode:radios_censales&outputFormat=shape-zip

# EDUCACION
educational_institution_url = https://mapa.educacion.gob.ar/geoserver/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=publico:establecimiento_educativo&outputFormat=SHAPE-ZIP
educational_institution_mi_url = https://mapa.educacion.gob.ar/geoserver/mapa_interactivo/ows?service=WFS&version=1.0.0&request=GetFeature&typeName=mapa_interactivo:establecimientos&maxFeatures=80000&viewparams=undefined&outputFormat=SHAPE-ZIP
university_institution_url = https://mapa.educacion.gob.ar/geoserver/ows?service=WFS&version=1.1.0&request=GetFeature&typeName=publico:institucion_universitaria&outputFormat=SHAPE-ZIP

# La variable 'output_dest_path' permite especificar una ruta
# adicional donde se deberían copiar todos los archivos finales al
# terminar cada proceso. Si se especifica una ruta relativa, es
# relativa a 'files_dir'.
output_dest_path = latest

# Tamaños de tablas esperados.
# Los siguientes valores representan la cantidad de entidades que se
# espera que el ETL genere para cada tipo de entidad. Notar que para
# provincias y departamentos, la cantidad generada se compara
# exactamente con el valor debajo. Para las demás entidades, el valor
# debajo se utiliza como un mínimo necesario de entidades que deben
# generarse.
provinces_target_size = 24
departments_target_size = 529
local_governments_target_size = 2280
census_localities_target_size = 4023
settlements_target_size = 14580
localities_target_size = 3346
streets_target_size = 333000
intersections_target_size = 1150000
street_blocks_target_size = 2048000
educational_institutions_target_size = 60000

# Parámetros de tolerancia para simplificar geometrías, cuanto más grande
# es el parámetro mayor es la tolerancia a la imprecisión y más liviana es
# la geometría
geojson_tolerance = 0.0085
geojson_caba_tolerance = 0.001

[mailer]
# Configuración del mailer. Por defecto, está deshabilitado y no es
# necesario configurarlo.

enabled = false
ssl = true
host =
port =
user =
password =
recipients =
recipients_localidades_censales =
recipients_calles =
recipients_cuadras =
include_json = true

[test_db]
# Conexión a base de datos de testeo.
# NO es necesario configurar estos valores para la ejecución del ETL.

host = db
port = 5432
database = georef_ar_etl_test
user = georef_test
password = changeme_test

[format_export]
# Los formatos a exportar para cada entidad

provinces = csv, json, geojson, ndjson
departments = csv, json, geojson, ndjson
local_governments = csv, json, geojson, ndjson
census_localities = csv, json, geojson, ndjson
settlements = csv, json, geojson, ndjson
localities = csv, json, geojson, ndjson
streets = csv, json, geojson, ndjson
street_blocks = csv, json, geojson, ndjson
intersections = csv, json, geojson, ndjson
educational_institutions = csv, json, geojson, ndjson
university_institutions = csv, json, geojson, ndjson